name: CI

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  code-checks:
    name: Code checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout compatible menu contracts
        uses: actions/checkout@v4
        with:
          repository: XBDJ504764827/sws2-cs2menus
          ref: 3c0ec3b6aca0016d82f365f32acddeba338ae439
          path: sws2-cs2menus
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'
      - run: dotnet restore sws2-armory.csproj
      - name: Verify formatting and analyzers
        run: dotnet format sws2-armory.csproj --verify-no-changes --no-restore --severity warn
      - name: Compile with warnings as errors
        run: dotnet build sws2-armory.csproj -c Release --no-restore -warnaserror
      - name: Loadout, catalog and input regression checks
        run: dotnet run --project tests/ArmoryChecks/ArmoryChecks.csproj -c Release
      - name: Catalog provenance, translations and version checks
        run: python3 tools/check_package.py

  test-package:
    name: Test package
    needs: code-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout compatible menu contracts
        uses: actions/checkout@v4
        with:
          repository: XBDJ504764827/sws2-cs2menus
          ref: 3c0ec3b6aca0016d82f365f32acddeba338ae439
          path: sws2-cs2menus
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Compute and inject preview version
        id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 tools/build_version.py --channel preview
      - run: dotnet restore sws2-armory.csproj
      - name: Compile preview package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build sws2-armory.csproj -c Release --no-restore -warnaserror -p:Version="$VERSION"
      - run: dotnet publish sws2-armory.csproj -c Release --no-build --no-restore
      - name: Validate and name test package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 tools/check_package.py build/sws2-armory.zip
          mv build/sws2-armory.zip "build/sws2-armory-v${VERSION}.zip"
          printf '### Test package ready\n\nVersion: `%s`\n\nDownload **sws2-armory-v%s** from this run’s Artifacts. Extract the inner ZIP into `csgo/addons/swiftlys2/plugins/`. Load `sws2-cs2menus` first.\n' "$VERSION" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: sws2-armory-v${{ steps.version.outputs.version }}
          path: build/sws2-armory-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30
